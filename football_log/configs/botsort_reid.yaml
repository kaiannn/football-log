# Tracker config: BoT-SORT with Re-ID embeddings enabled.
#
# Based on ultralytics' built-in botsort.yaml, with Re-ID appearance features
# added to the association cost. This is the recommended config for football
# tracking — combines camera motion compensation (GMC) with appearance matching.
#
# Tradeoffs vs bytetrack.yaml:
# + Better ID stability through occlusion (Re-ID)
# + Better recovery when camera pans (GMC)
# - Slower (~2x): the Re-ID network runs on every detection
#
# Usage:
#   python run.py --video match.mp4 --tracker botsort+reid

tracker_type: botsort

# Detection thresholds
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True

# Global Motion Compensation: helps when camera pans (broadcast footage)
gmc_method: sparseOptFlow

# Re-ID settings
with_reid: True
proximity_thresh: 0.5
appearance_thresh: 0.8
model: auto
